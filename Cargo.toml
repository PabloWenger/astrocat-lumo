[package]
name = "astrocat-lumo"
version = "0.1.0"
description = "Astrocat Lumo Sidecar"
authors = ["Pablo Wenger"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
tokio = { version = "1", features = ["full"] }
rfd = "0.14"
